# Pink Horizon for foot — for use OUTSIDE Omarchy.
# (On Omarchy 4, foot is themed automatically from colors.toml.)
# Usage: add  include=~/.config/foot/pink-horizon.ini  to ~/.config/foot/foot.ini
# Older foot versions (< 1.25) use [colors] instead of [colors-dark].

[colors-dark]
foreground=e6e1e4
background=141618
selection-foreground=f9eff5
selection-background=3a2433

cursor=141618 f9eff5

regular0=141618
regular1=f25f6b
regular2=39c2ab
regular3=f0c987
regular4=5aa2d8
regular5=f463ac
regular6=3fd6db
regular7=e6e1e4

bright0=6a6f75
bright1=ff8a93
bright2=6fe0c9
bright3=f7dcae
bright4=8cc4e8
bright5=fa99c7
bright6=6be7e3
bright7=f9eff5
urls=3fd6db
